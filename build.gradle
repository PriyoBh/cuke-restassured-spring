plugins {
    id 'idea'
    id 'java'
    id 'java-library'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

ext {
    CUCUMBER            = '7.15.0'
    GUAVA               = '33.0.0-jre'
    HAMCREST            = '2.2'
    JACKSON             = '2.16.1'
    SPRING_BOOT         = '3.2.2'
}

repositories {
    mavenCentral()
}

configurations {
    cucumberRuntime {
        extendsFrom testRuntime
    }
}

dependencies {

    api "com.google.guava:guava:${GUAVA}"
    api "com.fasterxml.jackson.core:jackson-annotations:${JACKSON}"
    api "com.fasterxml.jackson.core:jackson-core:${JACKSON}"
    api "com.fasterxml.jackson.core:jackson-databind:${JACKSON}"
    api "com.fasterxml.jackson.dataformat:jackson-dataformat-csv:${JACKSON}"
    testImplementation group: 'io.rest-assured', name: 'rest-assured', version: '5.4.0'
    testImplementation group: 'io.rest-assured', name: 'rest-assured-all', version: '5.4.0'
    testImplementation "org.hamcrest:hamcrest:${HAMCREST}"
    testImplementation "io.cucumber:cucumber-java:${CUCUMBER}"
    testImplementation "io.cucumber:cucumber-junit:${CUCUMBER}"
    testImplementation "io.cucumber:cucumber-spring:${CUCUMBER}"
    testImplementation "org.springframework.boot:spring-boot-starter-test:${SPRING_BOOT}"
    compileOnlyApi 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

task cucumberCli() {
    dependsOn assemble, testClasses
    doLast {
        javaexec {
            main = "io.cucumber.core.cli.Main"
            classpath = configurations.cucumberRuntime + sourceSets.main.output + sourceSets.test.output
            args = [
                    '--plugin', 'pretty',
                    '--plugin', 'html:target/cucumber-report.html',
                    '--glue', 'io.gorest.glue.definitions',
                    'src/test/resources/features']
        }
    }
}